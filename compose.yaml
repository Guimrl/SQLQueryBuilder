services:
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sqlquerybuilder};Username=${POSTGRES_USER:-sqlquerybuilder};Password=${POSTGRES_PASSWORD:-sqlquerybuilder_dev}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sqlquerybuilder}
      POSTGRES_USER: ${POSTGRES_USER:-sqlquerybuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqlquerybuilder_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
